[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Cantimbuhan", email = "cantimbuhanmark.stnick@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "svix>=2.3.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
dev = "backend:main.main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
