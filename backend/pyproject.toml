[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Cantimbuhan", email = "cantimbuhanmark.stnick@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.102",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "openai-agents>=0.22.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.2",
    "svix>=2.3.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
dev = "backend:main.main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
