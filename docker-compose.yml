services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutriprep}
      MYSQL_USER: ${MYSQL_USER:-nutriprep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutriprep}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-nutriprep}:${MYSQL_PASSWORD:-nutriprep}@mysql:3306/${MYSQL_DATABASE:-nutriprep}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      JWT_KEY: ${JWT_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http backend:8000 --log=stdout
    depends_on:
      - backend

volumes:
  mysql_data: