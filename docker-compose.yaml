services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutriprep}
      MYSQL_USER: ${MYSQL_USER:-nutriprep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutriprep}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-adminpassword}
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutriprep}
      MYSQL_USER: ${MYSQL_USER:-nutriprep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutriprep}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-nutriprep}:${MYSQL_PASSWORD:-nutriprep}@mysql:3306/${MYSQL_DATABASE:-nutriprep}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_BUCKET: ${AWS_BUCKET:-nutriprep}
      AWS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      AWS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-adminpassword}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      JWT_KEY: ${JWT_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http backend:8000 --log=stdout
    depends_on:
      - backend

volumes:
  mysql_data:
  rustfs_data: